<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 锁定视口：禁用缩放，禁滚动，适配手机横屏 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>津门治略 · 天津道台沙盘</title>
<style>
/* =====================================================================
 * 基础：古风氛围 —— 宣纸底、宫墙红、墨色描边，纯 CSS 渐变色块
 * 无图片/Canvas，禁用滚动
 * ===================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: "PingFang SC", "Microsoft YaHei", "SimSun", serif;
  /* 宣纸质感：米黄到浅褐的径向渐变 */
  background: radial-gradient(circle at 50% 20%, #f7efdb 0%, #efe3c6 55%, #e6d5ae 100%);
  color: #33291a;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  position: fixed;
  width: 100%;
}
body { -webkit-user-select: none; user-select: none; }
body.selectable, body.selectable * { -webkit-user-select: text; user-select: text; }
button, .attr-cell { -webkit-touch-callout: none; }

/* =====================================================================
 * 起始页（封面）：宫墙红 + 墨色大字标题 + 开始/继续按钮
 * ===================================================================== */
#start-screen {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  /* 宫墙红渐变背景，模拟古风封面 */
  background: radial-gradient(circle at 50% 30%, #a33a2b 0%, #7a2318 55%, #4d130c 100%);
  padding: 30px;
}
#start-screen .frame {
  width: 100%; max-width: 420px;
  padding: 40px 28px;
  border: 3px double #e8c97a;
  border-radius: 14px;
  background: rgba(0,0,0,.18);
  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}
#start-screen .sub { font-size: 13px; letter-spacing: 6px; color: #e8c97a; margin: 0 0 6px; }
#start-screen h1 {
  font-size: 52px; margin: 0 0 8px; color: #f7e6b8;
  letter-spacing: 10px; font-weight: bold;
  text-shadow: 0 2px 6px rgba(0,0,0,.5);
}
#start-screen .seal {
  display: inline-block; margin: 8px 0 18px;
  color: #e8c97a; font-size: 15px; letter-spacing: 3px;
  border: 1px solid #e8c97a; padding: 3px 14px; border-radius: 4px;
}
#start-screen .btn {
  display: block; width: 100%; max-width: 260px; margin: 12px auto;
  min-height: 52px; padding: 10px 20px;
  font-family: inherit; font-size: 18px; letter-spacing: 4px;
  color: #4d130c; background: #e8c97a;
  border: 1px solid #b98a2e; border-radius: 8px; cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,.35);
}
#start-screen .btn:active { background: #f0d898; transform: translateY(1px); }
#start-screen .btn.ghost {
  background: transparent; color: #f7e6b8; border: 1px solid #e8c97a;
}
#start-screen .hint { font-size: 12px; color: #d8c48a; margin-top: 14px; }

/* =====================================================================
 * 主游戏容器
 * ===================================================================== */
#game {
  position: fixed; inset: 0; z-index: 1;
  display: none;
  grid-template-rows: auto 1fr;
  gap: 0;
}
/* 顶部标题条：宫墙红 */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; gap: 8px;
  background: linear-gradient(180deg, #8a2a1e 0%, #6f1f15 100%);
  color: #f7e6b8;
  font-size: 14px; flex-wrap: wrap;
  border-bottom: 2px solid #4d130c;
}
#topbar .t-title { font-size: 17px; font-weight: bold; letter-spacing: 4px; }
#topbar .t-info { color: #e8c97a; }
#topbar button {
  background: #4d130c; color: #f7e6b8; border: 1px solid #e8c97a;
  border-radius: 6px; min-height: 34px; font-family: inherit;
}

/* =====================================================================
 * 三栏主区：属性 | 行动 | 弹窗区（木质/宣纸栏框）
 * ===================================================================== */
#main {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 10px;
  padding: 10px;
  min-height: 0;
}
.col {
  background: linear-gradient(180deg, #fbf6e8 0%, #f3ead2 100%);
  border: 1px solid #b89b68;
  border-radius: 10px;
  padding: 12px;
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: inset 0 0 0 1px #fdf9ee, 0 2px 6px rgba(90,70,40,.15);
}
.col h2 {
  font-size: 15px; margin: 0 0 10px; color: #6a5834;
  border-bottom: 2px solid #d4b877; padding-bottom: 6px; letter-spacing: 2px;
}

/* ---------- 左栏 · 属性 ---------- */
#col-left { overflow-y: auto; }
.attr-cell {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 7px 4px; border-bottom: 1px dashed #e5dabc;
  font-size: 14px;
}
.attr-cell .k { color: #6a5834; }
.attr-cell .v { font-weight: bold; font-size: 15px; }
/* 属性最近变化的方向标记：增益绿 / 减益红 */
.attr-cell .d { margin-left: 6px; font-size: 12px; min-width: 34px; text-align: right; }
.d-up   { color: #15803d; }   /* 增益 —— 绿色 */
.d-down { color: #c0262d; }   /* 减益 —— 红色 */
.d-none { color: #b5a87f; }
#game-meta { margin-top: 10px; font-size: 13px; color: #6a5834; border-top: 1px solid #e9e0c4; padding-top: 8px; }
#game-meta b { color: #33291a; }
#game-meta .small { color: #9a8a62; }

/* ---------- 中栏 · 行动 ---------- */
#col-mid { overflow-y: auto; }
.act-btn {
  display: block; width: 100%;
  min-height: 46px;
  margin: 7px 0; padding: 6px 12px;
  font-family: inherit; font-size: 14px;
  text-align: left;
  background: linear-gradient(180deg, #fdf9ec 0%, #f5ecd6 100%);
  color: #4a3b1d;
  border: 1px solid #b89b68; border-radius: 8px;
  cursor: pointer;
  transition: background .15s;
  box-shadow: 0 1px 3px rgba(90,70,40,.18);
}
.act-btn .lab { font-weight: bold; font-size: 15px; }
.act-btn .sub { display: block; font-size: 11px; color: #9a8a62; margin-top: 2px; }
.act-btn:active { background: #8a2a1e; color: #f7e6b8; }   /* 按下变宫墙红 */
.act-btn:active .sub { color: #e8c97a; }
.act-btn:disabled { opacity: .45; cursor: not-allowed; }
.act-btn:disabled:active { background: linear-gradient(180deg, #fdf9ec 0%, #f5ecd6 100%); color: #4a3b1d; }
#ap-note { font-size: 12px; color: #8a7a55; margin-top: 8px; }
.log { font-size: 12px; color: #6a5834; border-top: 1px dashed #e5dabc; margin-top: 10px; padding-top: 6px; max-height: 130px; overflow-y: auto; }
.log div { padding: 1px 0; }

/* ---------- 右栏 · 弹窗区 ---------- */
#col-right { overflow-y: auto; }
.right-pad { color: #a2966f; font-size: 13px; text-align: center; margin-top: 30%; }

/* =====================================================================
 * 模态遮罩：弹出时全屏覆盖背景变暗，屏蔽底层按钮误触
 * 弹窗内容在右栏（横排时偏右），但为保证清晰与触控合理，居中于遮罩
 * ===================================================================== */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(30, 22, 8, .72);
  display: none; align-items: center; justify-content: flex-end;
  padding: 12px;
}
.modal {
  width: 100%; max-width: 420px; max-height: 92%;
  margin-left: auto;
  background: linear-gradient(180deg, #fbf6e8 0%, #f3ead2 100%);
  border: 2px solid #8a2a1e; border-radius: 12px;
  padding: 16px 18px;
  overflow-y: auto;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
.modal h3 { margin: 0 0 8px; font-size: 18px; color: #8a2a1e; letter-spacing: 2px; border-bottom: 1px solid #d4b877; padding-bottom: 6px; }
.modal .desc { font-size: 14px; color: #5a4a2c; margin: 0 0 12px; }
.modal .opt {
  display: block; width: 100%; min-height: 46px;
  margin: 8px 0; padding: 8px 12px;
  font-family: inherit; font-size: 14px; text-align: left;
  background: linear-gradient(180deg, #fdf9ec 0%, #f5ecd6 100%);
  color: #4a3b1d;
  border: 1px solid #b89b68; border-radius: 8px; cursor: pointer;
  transition: background .15s;
}
.modal .opt:active { background: #8a2a1e; color: #f7e6b8; }
.modal .opt .fx { display: block; font-size: 11px; color: #9a8a62; margin-top: 2px; }
.modal .actions { margin-top: 12px; display: flex; gap: 10px; }

/* 音效开关按钮（顶部条内，无音频时也可见） */
#btn-sound {
  min-width: 40px; font-family: inherit;
}

/* =====================================================================
 * 全屏事件页：事件触发时铺满全屏，含场景卡图区 + 描述 + 选项
 * ===================================================================== */
#event-screen {
  position: fixed; inset: 0; z-index: 120;
  display: none; flex-direction: column;
  background: radial-gradient(circle at 50% 30%, #2a2418 0%, #17130b 100%);
  color: #f0e6c8; padding: 18px 20px;
  overflow-y: auto;
}
#event-screen .ev-head {
  text-align: center; margin-bottom: 12px;
}
#event-screen .ev-head .tag {
  display: inline-block; font-size: 12px; letter-spacing: 3px;
  color: #e8c97a; border: 1px solid #e8c97a; padding: 2px 12px; border-radius: 4px;
}
#event-screen .ev-head h3 {
  margin: 8px 0 2px; font-size: 24px; letter-spacing: 4px; color: #f7e6b8;
  text-shadow: 0 2px 6px rgba(0,0,0,.6);
}
/* 场景卡：主题字大号居中 + 副题 + 渐变底色 + 纹样边框 */
#event-scene {
  flex: 0 0 auto;
  min-height: 170px;
  border-radius: 12px;
  border: 3px double #e8c97a;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  margin-bottom: 14px;
  box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.5);
  position: relative; overflow: hidden;
}
#event-scene .zi {
  font-size: 88px; font-weight: bold; color: rgba(255,240,200,.92);
  text-shadow: 0 4px 12px rgba(0,0,0,.5); line-height: 1;
}
#event-scene .sub {
  font-size: 15px; letter-spacing: 4px; color: #e8c97a; margin-top: 6px;
}
#event-screen .ev-desc {
  font-size: 15px; line-height: 1.7; color: #f0e6c8;
  background: rgba(0,0,0,.28); border-radius: 10px; padding: 12px 14px;
  margin-bottom: 14px;
}
#event-screen .ev-opts { flex: 0 0 auto; }
#event-screen .opt {
  display: block; width: 100%; min-height: 54px;
  margin: 9px 0; padding: 10px 14px;
  font-family: inherit; font-size: 15px; text-align: left;
  background: linear-gradient(180deg, #3a3122 0%, #2a2318 100%);
  color: #f7e6b8;
  border: 1px solid #b89b68; border-radius: 10px; cursor: pointer;
  transition: background .15s;
}
#event-screen .opt:active { background: #8a2a1e; }
#event-screen .opt .fx { display: block; font-size: 12px; color: #c8b47a; margin-top: 3px; }

/* =====================================================================
 * 响应式适配：任何方向都呈现"横屏三栏"游戏画面
 *  - 横屏：三栏并排（属性 | 行动 | 弹窗区），正常显示
 *  - 竖屏：将游戏界面旋转 90° 横铺，用户竖持手机也能看到横向三栏，
 *          无需手动旋转手机、无提示、无引导页，扫码即玩。
 * ===================================================================== */
@media (orientation: portrait) {
  #game {
    width: 100vh;
    height: 100vw;
    transform: rotate(90deg);
    transform-origin: center center;
    position: fixed;
    top: 50%; left: 50%;
    margin-left: -50vh;
    margin-top: -50vw;
  }
  /* 全屏事件页、结局弹窗同样横铺，保持视觉一致 */
  #event-screen, #end-mask {
    width: 100vh; height: 100vw;
    transform: rotate(90deg);
    transform-origin: center center;
    position: fixed;
    top: 50%; left: 50%;
    margin-left: -50vh;
    margin-top: -50vw;
  }
  #start-screen { transform: none; }
}
</style>
</head>
<body>

<!-- ======================= 起始页（封面） ======================= -->
<div id="start-screen">
  <div class="frame">
    <p class="sub">光 绪 二 十 二 年</p>
    <h1>津门治略</h1>
    <span class="seal">天 津 道 台 沙 盘</span>
    <p style="color:#f0e0b0;font-size:14px;letter-spacing:2px;margin:4px 0 8px;">守一方水土 · 理百业民生</p>
    <button class="btn" id="btn-start-new">开 始 游 戏</button>
    <button class="btn ghost" id="btn-start-continue" style="display:none;">继 续 游 戏</button>
    <p class="hint">回合制 · 一回合一月 · 每月四行动点</p>
  </div>
</div>

<!-- ======================= 游戏主界面 ======================= -->
<div id="game">
  <div id="topbar">
    <span class="t-title">津门治略</span>
    <span class="t-info" id="top-date"></span>
    <button id="btn-sound">音效：开</button>
    <button id="btn-save-home">存 档 · 首页</button>
  </div>
  <div id="main">
    <!-- 左栏：属性 -->
    <div class="col" id="col-left">
      <h2>属性</h2>
      <div id="attr-list"></div>
      <div id="game-meta">
        <div>年号：<b id="m-year"></b></div>
        <div>月份：<b id="m-month"></b> ｜ 回合：<b id="m-round"></b></div>
        <div>剩余行动点：<b id="m-ap"></b> / 4</div>
        <div class="small">增益<span class="d-up"> 绿</span> ｜ 减益<span class="d-down"> 红</span></div>
      </div>
    </div>
    <!-- 中栏：行动 -->
    <div class="col" id="col-mid">
      <h2>官署行动</h2>
      <div id="action-list"></div>
      <div id="ap-note"></div>
      <div class="log" id="log"></div>
    </div>
    <!-- 右栏：弹窗区（事件/结局由浮层呈现） -->
    <div class="col" id="col-right">
      <h2>津城政报</h2>
      <div class="right-pad" id="right-pad">横屏政务沙盘<br>回合事件于此呈现</div>
    </div>
  </div>
</div>

<!-- ======================= 全屏事件页（场景卡 + 描述 + 选项） ======================= -->
<div id="event-screen">
  <div class="ev-head">
    <span class="tag" id="event-tag">事件</span>
    <h3 id="event-title"></h3>
  </div>
  <div id="event-scene">
    <span class="zi" id="event-zi"></span>
    <span class="sub" id="event-sub"></span>
  </div>
  <p class="ev-desc" id="event-desc"></p>
  <div class="ev-opts" id="event-options"></div>
</div>

<!-- ======================= 事件弹窗（浮层，右对齐，保留兼容） ======================= -->
<div class="modal-mask" id="event-mask" style="display:none;">
  <div class="modal">
    <h3 id="event-title-legacy"></h3>
    <p class="desc" id="event-desc-legacy"></p>
    <div id="event-options-legacy"></div>
  </div>
</div>

<!-- ======================= 结局弹窗（浮层，右对齐） ======================= -->
<div class="modal-mask" id="end-mask">
  <div class="modal">
    <h3 id="end-title"></h3>
    <p class="desc" id="end-desc"></p>
    <div class="actions">
      <button class="opt" id="end-restart" style="width:auto;">重新开局</button>
      <button class="opt" id="end-home" style="width:auto;">返回首页</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
 * 《津门治略》 —— 横屏移动端回合制沙盘（单文件，GitHub Pages 可用）
 * ---------------------------------------------------------------------
 * 玩法数据与既定设定完全一致（属性/行动/事件/结局/存档逻辑）。
 * 本文件仅针对"横屏手机优先"重写布局与触控适配。
 * 模块：
 *   0. 工具与存储
 *   1. 属性 / 行动 / 事件 / 结局 元数据
 *   2. 状态管理（初始值、上限、存档读档）
 *   3. 屏幕方向检测与触控初始化
 *   4. 渲染（属性 / 行动 / 日志 / 弹窗）
 *   5. 游戏流程（行动 → 回合推进 → 事件 → 结局）
 * ===================================================================== */

/* =====================================================================
 * 0. 工具与存储
 * ===================================================================== */
function $(id) { return document.getElementById(id); }

/* ---------- 程序化音效（Web Audio 合成，无需音频文件） ---------- */
var SOUND = {
  enabled: true,
  ctx: null,
  ensure: function () {
    // 惰性创建 AudioContext（需在用户手势后，移动端自动播放限制）
    if (!this.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  /* 播放一个短音：type 波形，freq 频率，dur 时长（秒），gain 音量 */
  tone: function (type, freq, dur, gain) {
    if (!this.enabled) return;
    this.ensure();
    if (!this.ctx) return;
    var t = this.ctx.currentTime;
    var osc = this.ctx.createOscillator();
    var g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    // 快速淡入淡出，避免爆音
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  click: function () { this.tone("square", 600, 0.06, 0.12); },   // 按钮点击
  action: function () { this.tone("triangle", 440, 0.12, 0.18); this.tone("triangle", 660, 0.10, 0.10); }, // 执行行动
  event: function () { this.tone("sine", 220, 0.20, 0.22); this.tone("sine", 330, 0.18, 0.15); },          // 事件弹出
  ending: function () { this.tone("sine", 196, 0.5, 0.25); this.tone("sine", 294, 0.6, 0.2); },            // 结局钟鸣
  good: function () { this.tone("triangle", 523, 0.10, 0.14); this.tone("triangle", 784, 0.12, 0.10); },   // 增益
  bad: function () { this.tone("sawtooth", 180, 0.16, 0.12); }                                             // 减益
};

var SAVE_KEY = "jinmen_save_v1";

function saveGame(state) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, state: state }));
    return true;
  } catch (e) { return false; }
}
function loadGame() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    var data = JSON.parse(raw);
    if (!data || !data.state) return null;
    var s = data.state;
    // 兼容校验：补齐缺失字段
    for (var k in ATTRS) { if (typeof s[k] !== "number") s[k] = ATTRS[k].ini; }
    if (!s.history || typeof s.history !== "object") s.history = [];
    if (typeof s.ap !== "number") s.ap = 4;
    return s;
  } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* 修改属性（整表），并记录每个属性的最近变化量供面板显示 */
function applyEffects(state, effect, lastDiff) {
  for (var k in effect) {
    if (!(k in ATTRS)) continue;
    var old = state[k];
    state[k] += effect[k];
    if (state[k] > ATTRS[k].max) state[k] = ATTRS[k].max; // 只截上限，允许为负
    // 记录最近一次变化量（本次实际净变化，考虑上限截断）
    if (lastDiff) lastDiff[k] = state[k] - old;
  }
}

/* =====================================================================
 * 1. 元数据
 * ===================================================================== */
/* 属性定义。库银/仓粮为库存型上限9999；其余比率型上限100。
 * lastDiff：渲染时显示"最近一次变化"，初始为 0 */
var ATTRS = {
  "kuyin":     { name: "库银",     unit: "两", max: 9999, ini: 750 },
  "cangliang": { name: "仓粮",     unit: "石", max: 9999, ini: 500 },
  "minwang":   { name: "民望",     unit: "",   max: 100,  ini: 55 },
  "zhian":     { name: "津门治安", unit: "",   max: 100,  ini: 52 },
  "hefang":    { name: "河防稳固度", unit: "", max: 100, ini: 42 },

  TJ014: { zi:"船", sub:"洋船碰船", c1:"#4a5a6a", c2:"#1e2a38" },   // 租界
  TJ015: { zi:"考", sub:"机器局招考", c1:"#4a4a5a", c2:"#20202e" }, // 洋务
  TJ016: { zi:"电", sub:"电杆妈祖庙", c1:"#5a6a3a", c2:"#283216" }, // 洋务
  TJ017: { zi:"逃", sub:"民夫逃散", c1:"#6a4a2a", c2:"#33210f" },   // 河防
  TJ018: { zi:"赌", sub:"胥吏包赌", c1:"#5a3a2a", c2:"#2a160f" },   // 吏治
  TJ019: { zi:"饷", sub:"营勇催饷", c1:"#7a3a2a", c2:"#3f1a10" },   // 治安
  TJ020: { zi:"善", sub:"善堂争赈", c1:"#3a5a4a", c2:"#16281f" }    // 民生
};

/* 依据选项效果判断音效：只看"成效类"属性净变化（民望/治安/河防/洋务/租界/清廉），
 * 库银/仓粮的增减属资源投入，不影响音效倾向。净正→good，净负→bad，持平→action */
function optionSound(effect) {
  var pos = 0, neg = 0;
  var OUTCOMES = { minwang:1, zhian:1, hefang:1, yangwu:1, zujie:1, qinglian:1 };
  for (var k in effect) {
    if (!OUTCOMES[k]) continue;
    if (effect[k] > 0) pos += effect[k];
    else if (effect[k] < 0) neg += -effect[k];
  }
  if (pos > neg) return "good";
  if (neg > pos) return "bad";
  return "action";
}

/* 结局：5 条（原既定设定的占位，可替换） */
var ENDINGS = [
  { id:"E1", title:"库银破产 · 亏空难支",
    c:function(s){ return s.kuyin<=-500; },
    desc:"库银亏空逾五百两，钱粮无着，诸事停滞。朝廷闻奏震怒，你被革职拿问，一肩担下亏空之罪，津门政事戛然而止。" },
  { id:"E2", title:"民变 · 城厢失序",
    c:function(s){ return s.minwang<=15||s.zhian<=15; },
    desc:"民怨沸腾、治安崩坏，饥民与无赖啸聚，焚署劫库。乱起仓猝，你虽竭力弹压，终究无力回天，津门陷入混乱。" },
  { id:"E3", title:"吏治崩溃 · 瓜蔓抄",
    c:function(s){ return s.qinglian<=15; },
    desc:"官署上下侵蚀成风，贪墨之弊不可收拾。御史参劾，弹章如雪片般飞入京师，你身为道台难辞其咎，被逮入都。" },
  { id:"E4", title:"洋务大成 · 北洋干城",
    c:function(s){ return s.yangwu>=80&&s.qinglian>=50; },
    desc:"机器局、电报、轮船皆井然有序，洋务蒸蒸日上，官风清廉。朝廷嘉许，擢你为督抚大员，津门洋务之兴，全国瞩目。" },
  { id:"E5", title:"治绩卓著 · 民安物阜",
    c:function(s){ return s.hefang>=75&&s.minwang>=75&&s.zhian>=70&&s.kuyin>=1000&&s.cangliang>=2500; },
    desc:"河防稳固、仓廪充实、民望隆盛、治安井然。三年任满，万民遮道相送，你以卓然治绩获召入京，荣升户部侍郎。" }
];

/* 连锁历史辅助 */
function hasEvent(h, id) { for (var i=0;i<h.length;i++) if(h[i].id===id) return true; return false; }
function hasChosen(h, id, idx) { for (var i=0;i<h.length;i++) if(h[i].id===id&&h[i].chosenIndex===idx) return true; return false; }

/* =====================================================================
 * 2. 状态
 * ===================================================================== */
function initialState() {
  var s = { month: 2, year: 0, round: 1, ap: 4 };
  for (var k in ATTRS) s[k] = ATTRS[k].ini;
  s.history = [];
  return s;
}

/* =====================================================================
 * 3. 屏幕方向检测与触控初始化
 * ===================================================================== */
var landscape = true; // 当前是否横屏
function updateOrientation() {
  landscape = window.innerWidth >= window.innerHeight;
  // 游戏始终显示（只要已开局）；竖屏由 CSS 旋转横铺，无需提示
  if (gameState) { $("game").style.display = "grid"; }
}

/* 触控：禁止双击缩放（配合 meta 双保险）、阻止双击/长按高亮选择 */
function setupTouch() {
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  // 阻止 iOS 双击缩放与长按菜单
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  // 阻止点击时快速聚焦缩放（Safari 老版本）
  document.addEventListener("touchstart", function () {}, { passive: true });
}
/* 禁止页面滚动：但允许游戏容器、栏、弹窗内部滚动（竖屏时需上下滚动） */
document.addEventListener("touchmove", function (e) {
  if (e.target && e.target.closest && e.target.closest(".modal, .col, #game, #main, #col-left, #col-mid, .log")) {
    // 允许这些容器内部滚动
    return;
  }
  e.preventDefault();
}, { passive: false });

/* =====================================================================
 * 4. 渲染
 * ===================================================================== */
var gameState = null;
var endingActive = false;
var eventChainDepth = 0;
var lastDiff = {}; // 各属性最近一次变化量，用于面板 +/- 色标

function dateText(s) { return YEARS[s.year] + " " + MONTHS[s.month - 1]; }

function renderTop() {
  $("top-date").textContent = dateText(gameState);
  $("m-year").textContent = YEARS[gameState.year];
  $("m-month").textContent = MONTHS[gameState.month - 1];
  $("m-round").textContent = gameState.round;
  $("m-ap").textContent = gameState.ap;
}

function renderAttrs() {
  var list = $("attr-list");
  list.innerHTML = "";
  Object.keys(ATTRS).forEach(function (k) {
    var a = ATTRS[k];
    var cell = document.createElement("div");
    cell.className = "attr-cell";
    var kSpan = document.createElement("span");
    kSpan.className = "k";
    kSpan.textContent = a.name;
    var vSpan = document.createElement("span");
    vSpan.className = "v";
    vSpan.textContent = gameState[k] + (a.unit ? " " + a.unit : "");
    if (a.max <= 100) vSpan.textContent += " /" + a.max;
    // 危险低值直观标红
    if (dangerLow(k, gameState[k])) vSpan.style.color = "#c0262d";
    var dSpan = document.createElement("span");
    dSpan.className = "d";
    var d = lastDiff[k] || 0;
    if (d > 0) { dSpan.textContent = "+" + d; dSpan.className += " d-up"; }
    else if (d < 0) { dSpan.textContent = d; dSpan.className += " d-down"; }
    else { dSpan.textContent = "—"; dSpan.className += " d-none"; }
    cell.appendChild(kSpan);
    var wrap = document.createElement("span");
    wrap.appendChild(vSpan);
    wrap.appendChild(dSpan);
    cell.appendChild(wrap);
    list.appendChild(cell);
  });
}
function dangerLow(k, v) {
  var m = { minwang:25, zhian:25, hefang:25, kuyin:0, cangliang:100, yangwu:5, zujie:20, qinglian:20 };
  return v < (m[k] !== undefined ? m[k] : 0);
}

function renderActions() {
  var box = $("action-list");
  box.innerHTML = "";
  ACTIONS.forEach(function (a) {
    var b = document.createElement("button");
    b.className = "act-btn";
    b.disabled = gameState.ap < a.ap || endingActive;
    b.innerHTML = '<span class="lab">' + a.label + '</span><span class="sub">' + a.sub + '</span>';
    b.addEventListener("click", function () { doAction(a.id); });
    box.appendChild(b);
  });
  $("ap-note").textContent = gameState.ap >= 4
    ? "本月行动点：4 点可用。"
    : "本月已用 " + (4 - gameState.ap) + " 点。";
}

function addLog(msg) {
  var log = $("log");
  var div = document.createElement("div");
  div.textContent = msg;
  log.insertBefore(div, log.firstChild);
}

function clearLastDiff() {
  lastDiff = {};
  for (var k in ATTRS) lastDiff[k] = 0;
}

function renderAll() {
  renderTop();
  renderAttrs();
  renderActions();
}

/* =====================================================================
 * 5. 游戏流程
 * ===================================================================== */

/* 开局入口 */
function newGame() {
  gameState = initialState();
  endingActive = false;
  clearLastDiff();
  $("log").innerHTML = "";
  addLog("光绪二十二年二月，你奉旨就任天津道台。");
  $("start-screen").style.display = "none"; // 关闭封面
  $("game").style.display = "grid";
  updateOrientation();
  renderAll();
  autosave();
}

/* 读档入口 */
function resumeGame() {
  var s = loadGame();
  if (s) {
    gameState = s;
    endingActive = false;
    clearLastDiff();
    $("log").innerHTML = "";
    addLog("已读取存档，继续治理津门……");
    $("start-screen").style.display = "none";
    $("game").style.display = "grid";
    updateOrientation();
    renderAll();
    checkEnding();
  } else {
    // 无存档：直接开局
    newGame();
    addLog("（未检测到存档，已自动开始新局）");
  }
}

/* 执行行动 */
function doAction(actionId) {
  if (endingActive || !gameState) return;
  var a = ACTION_BY_ID[actionId];
  if (!a) return;
  if (gameState.ap < a.ap) { alert("本回合行动点不足。"); return; }

  gameState.ap -= a.ap;
  clearLastDiff();
  applyEffects(gameState, a.effect, lastDiff);

  var parts = [];
  Object.keys(a.effect).forEach(function (k) {
    if (!(k in ATTRS)) return;
    var v = a.effect[k];
    parts.push(ATTRS[k].name + (v >= 0 ? "+" : "") + v);
  });
  var msg = "【" + a.label + "】" + (parts.length ? "　" + parts.join("，") : "");
  addLog(msg);
  SOUND.action(); // 行动音效

  // 行动后判定结局
  if (checkEnding()) { renderAll(); return; }

  renderAll();
  autosave();

  if (gameState.ap <= 0) { endRound(); }
}

/* 回合推进 */
function endRound() {
  advanceMonth();
  gameState.round += 1;
  gameState.ap = 4;
  renderAll();
  addLog("—— " + dateText(gameState) + "，新的一月，重得 4 行动点 ——");
  autosave();

  if (checkEnding()) return;
  triggerRandomEvent();
}

function advanceMonth() {
  gameState.month += 1;
  if (gameState.month > 12) {
    gameState.month = 1;
    if (gameState.year < YEARS.length - 1) gameState.year += 1;
  }
}

/* 事件触发 */
function eligibleEvents() {
  var list = [];
  EVENTS.forEach(function (e) {
    try { if (e.c(gameState, gameState.history)) list.push(e); } catch (err) {}
  });
  return list;
}

function triggerRandomEvent() {
  if (endingActive) return;
  var list = eligibleEvents();
  if (list.length === 0) return;
  eventChainDepth = 0;
  showEventModal(list[Math.floor(Math.random() * list.length)]);
}

function showEventModal(ev) {
  // 全屏事件页渲染
  var theme = EVENT_THEMES[ev.id] || { zi:"事", sub:"津门政事", c1:"#4a4a4a", c2:"#222" };
  $("event-tag").textContent = "津 门 政 事";
  $("event-title").textContent = ev.title;
  $("event-zi").textContent = theme.zi;
  $("event-sub").textContent = theme.sub;
  // 场景卡底色渐变
  $("event-scene").style.background =
    "linear-gradient(160deg, " + theme.c1 + " 0%, " + theme.c2 + " 100%)";
  $("event-desc").textContent = ev.desc;

  var box = $("event-options");
  box.innerHTML = "";
  ev.opts.forEach(function (opt, idx) {
    var b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = opt.t + '<span class="fx">' + opt.f + '</span>';
    b.addEventListener("click", function () {
      clearLastDiff();
      applyEffects(gameState, opt.e, lastDiff);
      gameState.history.push({ id: ev.id, chosenIndex: idx });
      var parts = [];
      Object.keys(opt.e).forEach(function (k) {
        if (k in ATTRS) parts.push(ATTRS[k].name + (opt.e[k] >= 0 ? "+" : "") + opt.e[k]);
      });
      addLog("事件·" + ev.title + "：选「" + opt.t + "」" + (parts.length ? "　" + parts.join("，") : ""));
      // 按选项倾向播放差异化音效
      SOUND[optionSound(opt.e)]();
      $("event-screen").style.display = "none";
      renderAll();
      autosave();
      if (checkEnding()) return;
      // 连锁事件（最多两层）
      if (!endingActive && eventChainDepth < 2) {
        var again = eligibleEvents();
        if (again.length) {
          eventChainDepth += 1;
          showEventModal(again[Math.floor(Math.random() * again.length)]);
        }
      }
    });
    box.appendChild(b);
  });

  SOUND.event(); // 事件弹出音效
  $("event-screen").style.display = "flex";
}

/* 结局 */
function checkEnding() {
  for (var i = 0; i < ENDINGS.length; i++) {
    var e = ENDINGS[i];
    try {
      if (e.c(gameState)) {
        endingActive = true;
        $("end-title").textContent = "—— 结局：" + e.title + " ——";
        $("end-desc").textContent = e.desc;
        $("event-screen").style.display = "none";
        $("event-mask").style.display = "none";
        $("end-mask").style.display = "flex";
        SOUND.ending(); // 结局钟鸣音效
        clearSave(); // 结局后清除存档，避免读档回到已结束局面
        renderAll();
        return true;
      }
    } catch (err) {}
  }
  return false;
}

function closeAllModals() {
  var evs = $("event-screen"); if (evs) evs.style.display = "none";
  var evm = $("event-mask"); if (evm) evm.style.display = "none";
  var endm = $("end-mask"); if (endm) endm.style.display = "none";
}

function autosave() { if (gameState) saveGame(gameState); }

/* =====================================================================
 * 初始化
 * ===================================================================== */
function init() {
  setupTouch();

  // 起始页：开始游戏 / 继续游戏
  $("btn-start-new").addEventListener("click", function () {
    SOUND.click();
    newGame();
  });
  $("btn-start-continue").addEventListener("click", function () {
    SOUND.click();
    resumeGame();
  });

  // 音效开关
  $("btn-sound").addEventListener("click", function () {
    SOUND.enabled = !SOUND.enabled;
    $("btn-sound").textContent = "音效：" + (SOUND.enabled ? "开" : "关");
    if (SOUND.enabled) SOUND.click();
  });

  // 顶部"存档·首页"按钮：存档后回到起始页
  $("btn-save-home").addEventListener("click", function () {
    if (gameState && !endingActive) saveGame(gameState);
    SOUND.click();
    closeAllModals();
    $("game").style.display = "none";
    gameState = null;
    showStartScreen();
  });

  // 结局弹窗按钮
  $("end-restart").addEventListener("click", function () {
    $("end-mask").style.display = "none";
    newGame();
  });
  $("end-home").addEventListener("click", function () {
    $("end-mask").style.display = "none";
    $("game").style.display = "none";
    gameState = null;
    showStartScreen();
  });

  // 方向检测：加载时 + 旋转/缩放时
  window.addEventListener("resize", updateOrientation);
  window.addEventListener("orientationchange", function () { setTimeout(updateOrientation, 100); });
  updateOrientation();

  // 进入即显示起始页（封面），等待用户选择开始/继续
  showStartScreen();
}

/* 显示起始页：根据是否存在存档决定"继续游戏"是否可见 */
function showStartScreen() {
  var s = loadGame();
  $("btn-start-continue").style.display = s ? "block" : "none";
  $("start-screen").style.display = "flex";
}

window.addEventListener("DOMContentLoaded", init);
</script>
